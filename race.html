
<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffebf5">
  <title>Koşu Kulübü ♡ My Sweet Planner</title>
  <link rel="stylesheet" href="./club.css">
</head>
<body data-club-page="race" class="club-race-page">
  <div class="club-page-wrap">
    <header class="club-race-header">
      <a class="club-back" href="./index.html">← Ajandaya dön</a>
      <button id="clubProfileOpen" class="club-profile-button" type="button" hidden>👤 Profilim</button>
    </header>

    <div class="club-hero">
      <span class="club-kicker">MY SWEET PLANNER · STUDY CLUB</span>
      <h1>🏁 Koşu kulübü</h1>
      <p>Tek yolda birlikte ilerleyin. En çok çalışan en önde!</p>
      <p class="club-connection" id="clubStatus" role="status">Bağlanılıyor…</p>
    </div>

    <main>
      <section class="club-card club-road-card" aria-labelledby="clubRoadTitle">
        <div class="club-section-heading">
          <h2 id="clubRoadTitle">👟 Bu ayın yarış yolu</h2>
          <span id="clubMonthName" class="club-subtle"></span>
        </div>

        <div id="clubMount"></div>

        <div class="club-road-bottom">
          <span id="clubMyHours">Çalışma saatlerin hesaplanıyor…</span>
          <button type="button" class="club-btn club-btn-soft" id="clubSyncBtn">Saatimi güncelle</button>
        </div>
      </section>

      <section class="club-card club-invite-card" aria-labelledby="clubInviteTitle">
        <h2 id="clubInviteTitle">💌 Arkadaşlarını çağır</h2>
        <p>Bu bağlantıyı gönderdiğin kişiler aynı yarış odasına gelir.</p>

        <div class="club-invite-row">
          <input aria-label="Davet bağlantısı" id="clubInvite" readonly>
          <button class="club-btn" id="clubCopyBtn" type="button">Kopyala</button>
        </div>
      </section>

      <div class="club-bottom-grid">
        <section class="club-card">
          <h2>🏆 Sıralama</h2>
          <ol class="club-ranking" id="clubRanking"></ol>
        </section>

        <section class="club-card club-chat-panel">
          <h2>💬 Sohbet</h2>
          <div id="clubChatList" class="club-chat-messages" aria-live="polite"></div>

          <form id="clubChatForm" class="club-chat-form">
            <input id="clubChatInput" placeholder="Bir mesaj yaz…" maxlength="300" aria-label="Mesajın" required>
            <button id="clubChatSend" class="club-btn" type="submit">Gönder</button>
          </form>
        </section>
      </div>
    </main>
  </div>

  <script src="./firebase-config.js"></script>
  <script type="module" src="./club.js"></script>
</body>
</html>
